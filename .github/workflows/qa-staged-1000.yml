name: ZoKivo 1,000-player staging harness validation
on:
  pull_request:
    branches: [main]
    paths:
      - "qa/staged-real-1000.cjs"
      - "qa/2026-10-20-1000-player-test-report.md"
      - ".github/workflows/qa-staged-1000.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify staging runner syntax (no network or DB writes)
        run: node --check qa/staged-real-1000.cjs
      - name: Verify production database guard
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const s=fs.readFileSync('qa/staged-real-1000.cjs','utf8');
          assert(s.includes('BRANCH_ONLY_1000')&&s.includes('zokivo_qa_sandbox_guard'));
          assert(s.includes('exclusive-qa-1000-20261020'));
          assert(!s.includes('zokivo.xyz')&&!s.includes('zokivo.vynalthai.com'));
          assert(s.includes('127.0.0.1:3000'));
          console.log('QA_STAGING_GUARDS_PASS');
          NODE
