name: ZoKivo official domain 100 simulated-player end-to-end acceptance
on:
  workflow_dispatch:
    inputs:
      test_pin:
        description: "Fresh, isolated 6-digit QA room PIN created by an authorized operator"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: zokivo-official-100-functional-qa
  cancel-in-progress: false
jobs:
  real-official-domain-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ZOKIVO_TEST_ROOM_PIN: ${{ inputs.test_pin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate script and isolated QA room PIN
        run: |
          node --check scripts/qa-official-100-functional.mjs
          node -e 'if (!/^\d{6}$/.test(process.env.ZOKIVO_TEST_ROOM_PIN)) process.exit(2)'
      - name: 100 distinct region sessions, joins, answers, and settled scores
        run: node scripts/qa-official-100-functional.mjs
      - name: Upload sanitized QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zokivo-official-100-player-qa
          path: zokivo-official-100-session.json
          if-no-files-found: warn
