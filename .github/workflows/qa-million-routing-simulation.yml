name: ZoKivo million virtual players — routing model ONLY
on:
  pull_request:
    branches: [main]
    paths:
      - "qa/model-million-routing.cjs"
      - ".github/workflows/qa-million-routing-simulation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install offline test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify 1000000 virtual decisions using real routing policy
        run: node qa/model-million-routing.cjs
      - name: Confirm this workflow never opens a load generator
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const script=fs.readFileSync('qa/model-million-routing.cjs','utf8');
          if(!script.includes('realNetworkRequests:0')||!script.includes('realWebSocketConnections:0'))process.exit(1);
          console.log('NO_NETWORK_LOAD_CONFIRMED');
          NODE
