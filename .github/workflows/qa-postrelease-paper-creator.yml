name: ZoKivo final real browser creator and Paper acceptance
on:
  push:
    branches: [qa/postrelease-paper-creator-20261018]
    paths: [".github/workflows/qa-postrelease-paper-creator.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify real production desktop and mobile teacher user interface
        run: |
          node --check scripts/qa-postrelease-classroom-pages-20261018.mjs
          node scripts/qa-postrelease-classroom-pages-20261018.mjs
      - name: Attach browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zokivo-creator-paper-live-ui-screenshots
          path: qa-classroom-evidence/
          retention-days: 14
          if-no-files-found: warn
