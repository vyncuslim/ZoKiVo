name: ZoKivo post-fix teacher student real-browser acceptance 20261018
on:
  push:
    branches: [qa/production-student-teacher-browser-ux-20261018]
    paths: [".github/workflows/qa-student-teacher-post-fix-20261018.yml"]
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare real Chromium browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify teacher desktop phone and student desktop phone small-phone on production release
        run: |
          node --check scripts/qa-browser-teacher-student-20261018.mjs
          node scripts/qa-browser-teacher-student-20261018.mjs
      - name: Preserve responsive screenshots and complete report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zokivo-post-fix-classroom-ux-screenshots
          path: ux-evidence/
          retention-days: 14
          if-no-files-found: warn
