name: ZoKivo student + teacher desktop and mobile production UI acceptance
on:
  push:
    branches: [qa/production-student-teacher-browser-ux-20261018]
    paths: [".github/workflows/qa-student-teacher-ui-20261018.yml"]
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the actual deployed production interface with isolated client-side QA API responses
        run: |
          node --check scripts/qa-browser-teacher-student-20261018.mjs
          node scripts/qa-browser-teacher-student-20261018.mjs
      - name: Preserve screenshots and per-device acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zokivo-classroom-desktop-mobile-20261018
          path: ux-evidence/
          if-no-files-found: warn
          retention-days: 14
