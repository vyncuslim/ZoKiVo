name: ZoKivo Discover real production browser and search smoke 20261018
on:
  push:
    branches: [qa/live-discover-smoke-20261018]
    paths: [".github/workflows/qa-live-discover-20261018.yml"]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install actual Chromium for production browser acceptance
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify public API and browser Discover search and filters without production writes
        run: |
          node --check scripts/qa-live-discover-20261018.mjs
          node scripts/qa-live-discover-20261018.mjs
      - name: Publish acceptance evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zokivo-discover-production-browser-smoke
          path: discover-smoke-evidence/
          retention-days: 14
          if-no-files-found: warn
